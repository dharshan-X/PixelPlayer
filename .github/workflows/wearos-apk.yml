name: Build Wear OS APK (Debug)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wear:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Wear OS debug APK
        run: ./gradlew :wear:assembleDebug --build-cache --max-workers=2

      - name: Upload Wear OS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlay-wear-debug-apks
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          compression-level: 0
