image: eclipse-temurin:21-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  GIT_SUBMODULE_STRATEGY: recursive
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dandroid.builder.sdkDownload=true -Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC\""

# Cache Gradle dependencies, build cache, and Android SDK
cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle.kts
      - app/build.gradle.kts
    prefix: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - android-sdk-root/

# Packages installation & SDK setup before running scripts
before_script:
  - export ANDROID_HOME="${PWD}/android-sdk-root"
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools

  # Only download and install Android SDK if not already present in the cache
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/tools" ]; then
      echo "=== Android SDK not found in cache. Performing initial installation... ==="
      apt-get --quiet update --yes
      apt-get --quiet install --yes wget unzip git
      install -d $ANDROID_HOME
      wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
      unzip -q -d "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools.zip"
      mv -T "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
      sdkmanager --version
      yes | sdkmanager --licenses > /dev/null || true
      sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "platforms;android-36" "platforms;android-35" || true
      sdkmanager "platform-tools" || true
      sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}" "build-tools;35.0.0" || true
    else
      echo "=== Android SDK found in cache! Skipping SDK download. ==="
    fi

  - chmod +x ./gradlew

# Build Phone Debug APK
assembleDebug:
  interruptible: true
  stage: build
  script:
    - ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=true --build-cache --max-workers=2
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 7 days

# Build Phone Release APK
assembleRelease:
  interruptible: true
  stage: build
  script:
    - ./gradlew :app:assembleRelease -Ppixelplay.enableAbiSplits=true --build-cache --max-workers=2
  artifacts:
    paths:
      - app/build/outputs/apk/release/
    expire_in: 7 days

# Run Unit Tests
debugTests:
  needs: [assembleDebug]
  interruptible: true
  stage: test
  script:
    - ./gradlew :app:testDebug --build-cache --max-workers=2
